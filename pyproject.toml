[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raiko-toolkit"
version = "0.2.6"
description = "Reimon AI Krazy Orchestrator — a local-first, multi-provider LLM agent toolkit (TUI)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ramón Martínez" }]
keywords = ["llm", "agent", "tui", "textual", "llama.cpp", "mcp", "jira", "confluence"]
dependencies = [
    "openai>=1.0",
    "textual>=8.0",
    "rich>=13.0",
    "tiktoken>=0.5",
    "psutil>=5.9",
    "requests>=2.28",
    "paramiko>=3.0",
    "mcp[cli]>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "pyyaml>=6",
]

[project.scripts]
raiko = "tui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/ajaniramon/raiko-toolkit"

# Flat single-file modules. serve.py/models.py live under bench/ but tui.py imports
# them as top-level modules, so flatten them into the wheel root (force-include).
[tool.hatch.build.targets.wheel]
include = ["tui.py", "tools.py", "context.py", "mcp_client.py", "cli.py",
           "engine", "web"]

[tool.hatch.build.targets.wheel.force-include]
"bench/serve.py" = "serve.py"
"bench/models.py" = "models.py"
